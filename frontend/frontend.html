<!DOCTYPE html>
<html>
    <head>
        <title>
            Ghor gandu (T_T)
        </title>
        <style>
            .instruction{
            font-family:Monospace;
            font-size:30px;
            margin-top:100px;
            margin-left:550px;
            }
            .email-box{
                display:block;
                margin-left:530px;
                margin-bottom:10px;
                width:240px;
                height:35px;
                border-width:2px;
                border:solid;
                border-color:rgb(214, 221, 222);
                border-radius:5px;
            }
            .email-box::placeholder{
                font-family:Monospace;
                font-size:large;
            }
            .password-box{
                display:block;
                margin-left:530px;
                margin-bottom:10px;
                width:240px;
                height:35px;
                border-width:2px;
                border:solid;
                border-color:rgb(214, 221, 222);
                border-radius:5px;
            }
            .password-box::placeholder{
                font-family:Monospace;
                font-size:large;
            }
            .signup-para{
                font-family:Monospace;
                font-size:15px;
                margin-left:519px;
            }
            .redirect-line{
                color:red;
                
                
            }
            .redirect-line:hover{
                text-decoration:underline;
                cursor:pointer;
            }
            .login-button{
                margin-left:620px;
                padding-left:15px;
                padding-right:15px;
                padding-top:5px;
                padding-bottom:5px;
                font-family:Monospace;
                font-size:15px;
                display:block;
                border:none;
                color:white;
                background-color:black;
                border-radius:5px;
                cursor:pointer;
                transition: opacity 0.2s;

            }
            .login-button:hover{
                opacity: 0.7;
            }
            .login-button:active{
                background-color:red;
            }
        </style>
    </head>
    <body>
        <p class="instruction">
            Login brotha
        </p>
        <input class="email-box" type="text-box" placeholder="Email">
        <input class="password-box" type="text-box" placeholder="Password">
        <button class="login-button">
            Login
        </button>
        <p class="signup-para" href="">Don't have an account yet?<span class="redirect-line">Sign-up</span> </p>

    </body>
</html>
